<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat UI</title>
    <!-- {{marked.umd.js}} -->
    <!-- {{style.css}} -->
</head>
<body>
    <div id="login-container">
        <h1>Login</h1>
        <input type="email" value="nandukkd7164@gmail.com" id="email-input" placeholder="Enter email">
        <input value="Password@123" id="password-input" placeholder="Enter password">
        <button id="login-btn">Login</button>
        <p id="error-message" class="hidden"></p>
    </div>

    <div id="loader" class="hidden"></div>

    <div id="main-content" class="hidden">
        <div class="container">
            <div class="header">
                <select id="session-dropdown"></select>
                <button id="new-session-btn">New Session</button>
            </div>
            <div class="chat-view" id="chat-view">
            </div>
            <div class="message-area">
                <textarea id="message-input" placeholder="Type your message..."></textarea>
                <div id="mention-dropdown" class="dropdown-menu"></div>
            </div>
            <div class="footer">
                <div>
                    <select id="model-dropdown">
                      <option value="googleai gemini-2.5-flash-lite">Gemini 2.5 Flash Lite</option>
                      <option value="googleai gemini-2.5-flash">Gemini 2.5 Flash</option>
                    </select>
                    <input type="checkbox" id="yolo-mode" disabled checked name="yolo-mode">
                    <label for="yolo-mode">YOLO Mode</label>
                </div>
                <button id="send-btn"><span>Send</span><div class="loader"></div></button>
            </div>
        </div>
    </div>
    <!-- {{script.js}} -->
</body>
</html>
