<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat UI</title>
    <!-- {{style.css}} -->
</head>
<body>
    <div class="container">
        <div class="header">
            <select id="session-dropdown"></select>
            <button id="new-session-btn">New Session</button>
        </div>
        <div class="chat-view" id="chat-view">
            <div class="message user-message">
                <p>This is a user message.</p>
            </div>
            <div class="message ai-message">
                <p>This is an AI message.</p>
            </div>
            <div class="message thinking-message">
                <p>This is a thinking message.</p>
            </div>
            <div class="message ai-message">
                <div class="tool-call-card">
                    <div class="tool-call-title">Tool Call: readFile</div>
                    <div class="tool-call-subtitle">path/to/file.txt</div>
                </div>
            </div>
        </div>
        <div class="message-area">
            <textarea id="message-input" placeholder="Type your message..."></textarea>
            <div id="mention-dropdown" class="dropdown-menu"></div>
        </div>
        <div class="footer">
            <div>
                <select id="model-dropdown"></select>
                <input type="checkbox" id="yolo-mode" name="yolo-mode">
                <label for="yolo-mode">YOLO Mode</label>
            </div>
            <button id="send-btn">Send</button>
        </div>
    </div>
    <!-- {{script.js}} -->
</body>
</html>
